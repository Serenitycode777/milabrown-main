<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vedic Astrology · Jyotish</title>
<meta name="description" content="Live Vedic (sidereal) transits, a dasha calculator, and a guide to the planets, signs, nakshatras and houses of Jyotish.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@400;500&display=swap">
<style>
:root{
  --bg:#f6f3fb; --bg2:#ebe5f5; --ink:#2a1647; --muted:#5d4c78; --line:#8a6526; --accent:#5b2d91; --btn-bg:#2a1647; --btn-ink:#f6f3fb;
  --teal:#3f7f78; --retro:#b0573f; --card:#fff; --rule:rgba(42,22,71,.12);
  --serif:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --sans:"Jost", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme:light; box-sizing:border-box;
}
html{scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:1.0625rem; line-height:1.65; -webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--line); outline-offset:3px; border-radius:2px}
[hidden]{display:none !important}
.wrap{width:min(1120px,100% - 2.5rem); margin-inline:auto}
.dark{background:radial-gradient(ellipse 70% 80% at 72% 30%, #2a1450, #170b29 70%); color:#f4e8c8; --bg:#170b29; --bg2:#2a1450; --ink:#f4e8c8; --muted:#bfaedb; --line:#dcb97a; --btn-bg:#dcb97a; --btn-ink:#170b29; --teal:#8fc4b8; --retro:#e6a08c; --card:rgba(255,255,255,.04); --rule:rgba(220,185,122,.18)}
.white{background:#fff}
.btn{display:inline-block; background:var(--btn-bg); color:var(--btn-ink); text-decoration:none; font:500 1rem var(--sans); padding:.85rem 1.6rem; border-radius:999px; border:0; cursor:pointer; transition:transform .15s ease}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line)}

/* hero */
.hero{padding:clamp(2.5rem,7vw,6rem) 0 clamp(2.5rem,6vw,4.5rem)}
.hero .wrap{display:grid; gap:2rem; grid-template-columns:1fr 1fr; align-items:center}
.hero h1{font-family:var(--serif); font-weight:500; font-size:clamp(2.6rem,6.2vw,4.7rem); line-height:1.02; margin:0 0 1.2rem; text-wrap:balance}
.hero p.lead{font-size:1.1rem; color:var(--muted); max-width:44ch; margin:0 0 2rem}
.index{display:flex; flex-wrap:wrap; gap:.4rem 1.3rem; margin:2.4rem 0 0; padding:0; list-style:none; font-family:var(--serif); font-size:1.15rem}
.index a{text-decoration:none; border-bottom:1px solid var(--line); padding-bottom:1px}
.wheel{width:100%; max-width:520px; justify-self:center; aspect-ratio:1/1; display:block}
.wheel .spin{transform-origin:200px 200px; animation:spin 240s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wheel-cap{text-align:center; color:var(--muted); font-size:.9rem; margin:.4rem 0 0}
.wheel .wp{cursor:pointer; outline:none}
.wheel .wp:hover circle,.wheel .wp:focus-visible circle{stroke:#f0d9a0; stroke-width:1.6}
.wheel.held .spin,.wheel:hover .spin{animation-play-state:paused}
.wtip{position:absolute; transform:translate(-50%,calc(-100% - 8px)); background:#f4e8c8; color:#170b29; font:500 .82rem/1.2 var(--sans); padding:.35rem .65rem; border-radius:8px; white-space:nowrap; pointer-events:none; opacity:0; transition:opacity .12s ease; box-shadow:0 4px 14px rgba(0,0,0,.35); z-index:5}
.wtip::after{content:""; position:absolute; left:50%; top:100%; margin-left:-5px; border:5px solid transparent; border-top-color:#f4e8c8}
.wtip.on{opacity:1}

/* sections */
.sec{padding:clamp(3rem,8vw,6rem) 0}
.sec h2{font-family:var(--serif); font-weight:500; font-size:clamp(2rem,4.2vw,3.1rem); line-height:1.08; margin:0 0 .8rem}
.sec p.intro{color:var(--muted); max-width:62ch; margin:0 0 1.8rem}
.label{font:500 .76rem var(--sans); letter-spacing:.16em; text-transform:uppercase; color:var(--line); margin:0 0 .45rem}

/* controls */
.controls{display:flex; flex-wrap:wrap; gap:.8rem 1rem; align-items:end; margin:0 0 1.6rem}
.controls label{display:grid; gap:.3rem; font:500 .74rem var(--sans); letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.controls input,.controls select{font:400 1rem var(--sans); letter-spacing:0; text-transform:none; color:var(--ink); background:var(--card); border:1px solid var(--rule); border-radius:12px; padding:.6rem .8rem; min-width:0}
.dark .controls input,.dark .controls select{background:rgba(255,255,255,.06); color:#f4e8c8; border-color:rgba(220,185,122,.35); color-scheme:dark}
.toggle{display:inline-flex; gap:.4rem}
.toggle button{font:inherit; font-size:.95rem; color:var(--ink); background:transparent; cursor:pointer; border:1px solid var(--line); border-radius:999px; padding:.45rem 1.1rem}
.toggle button[aria-pressed="true"]{background:var(--btn-bg); color:var(--btn-ink); border-color:var(--btn-bg)}

/* transit board (matches the transit pictures) */
.board{background:linear-gradient(180deg,#2a2142,#120d1e); border-radius:22px; padding:clamp(1.2rem,4vw,2.6rem); box-shadow:0 20px 60px -20px rgba(0,0,0,.6); color:#f4e8c8; max-width:860px}
.board h3{font-family:var(--sans); font-weight:500; color:#f0d9a0; font-size:clamp(1.6rem,4vw,2.5rem); margin:0 0 .3rem; letter-spacing:-.01em}
.board .sub{color:#a99cbc; margin:0 0 1.2rem; font-size:clamp(.85rem,2vw,1rem)}
.board hr{border:0; height:1px; background:linear-gradient(90deg,#dcb97a,rgba(220,185,122,0)); margin:0 0 .6rem}
.ttable{width:100%; border-collapse:collapse}
.ttable th{font:500 .72rem var(--sans); letter-spacing:.14em; text-transform:uppercase; color:#8fc4b8; text-align:left; padding:.5rem .4rem}
.ttable td{padding:.62rem .4rem; border-bottom:1px solid rgba(255,255,255,.07); font-size:clamp(.9rem,2.2vw,1.12rem); vertical-align:middle}
.ttable td.g{color:#dcb97a; font-size:1.25em; width:2.2em; text-align:center}
.ttable td.pl{font-weight:500}
.ttable td.sg{font-weight:500; white-space:nowrap}
.ttable td.sg span{color:#dcb97a; margin-right:.45em}
.ttable td.dg{white-space:nowrap; font-variant-numeric:tabular-nums}
.ttable td.nk{color:#b9aecb}
.ttable td.hs{color:#8fc4b8; font-weight:500; text-align:center; font-size:1.2em}
.ttable th:last-child{text-align:center}
.rpill{display:inline-block; font-size:.62em; font-weight:600; color:#e6a08c; border:1px solid #e6a08c; border-radius:5px; padding:0 .32em; margin-left:.45em; vertical-align:.2em}
.board .foot{color:#a99cbc; font-size:.9rem; margin:1.2rem 0 0}
.board .foot b{color:#f0d9a0; font-weight:500}
.nchart{width:100%; max-width:640px; display:block; margin:0 auto}
.nchart .ln{fill:none; stroke:#dcb97a; stroke-width:1.2}
.nchart .lag{fill:rgba(255,255,255,.05)}
.nchart .num{font:500 12px var(--sans); fill:#8fc4b8}
.nchart .pt{font:500 12.5px var(--sans); fill:#f4e8c8}
.nchart .pt tspan.ab{fill:#f0d9a0}
.nchart .pt tspan.r{fill:#e6a08c; font-size:9px}
.nchart .lg{font:500 9px var(--sans); letter-spacing:2px; fill:#cdb27a}
@media (max-width:640px){
  .ttable .nkcol{display:none}
  .board{padding:1rem .8rem; border-radius:16px}
  .ttable td,.ttable th{padding-left:.2rem; padding-right:.2rem}
  .ttable td{font-size:.88rem}
  .ttable th{font-size:.62rem; letter-spacing:.08em}
  .ttable td.g{width:1.5em}
  .ttable td.sg span{margin-right:.25em}
}

/* dasha */
.dform{background:var(--card); border:1px solid var(--rule); border-radius:18px; padding:1.2rem 1.3rem}
.dres{margin-top:1.4rem; display:grid; gap:1rem}
.facts{display:flex; flex-wrap:wrap; gap:.6rem}
.fact{background:rgba(220,185,122,.12); border:1px solid rgba(220,185,122,.35); border-radius:14px; padding:.7rem 1rem; min-width:12rem}
.fact b{display:block; font:500 .72rem var(--sans); letter-spacing:.14em; text-transform:uppercase; color:var(--line); margin-bottom:.15rem}
.fact span{font-family:var(--serif); font-size:1.3rem; line-height:1.25}
.mdlist{display:grid; gap:.45rem}
.md{border:1px solid var(--rule); border-radius:14px; background:var(--card); overflow:hidden}
.md > button{all:unset; box-sizing:border-box; width:100%; cursor:pointer; display:grid; grid-template-columns:2.2rem 1fr auto; gap:.6rem; align-items:center; padding:.7rem 1rem}
.md > button:focus-visible{outline:2px solid var(--line); outline-offset:-2px}
.md .gl{color:var(--line); font-size:1.3rem; text-align:center}
.md .nm{font-family:var(--serif); font-size:1.3rem}
.md .dt{color:var(--muted); font-size:.92rem; white-space:nowrap; font-variant-numeric:tabular-nums}
.md.now{border-color:var(--line); box-shadow:0 0 0 1px var(--line) inset}
.md .now-tag{font:500 .68rem var(--sans); letter-spacing:.14em; text-transform:uppercase; background:var(--btn-bg); color:var(--btn-ink); border-radius:999px; padding:.15rem .55rem; margin-left:.5rem; vertical-align:.25em}
.ads{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:.35rem .8rem; padding:.2rem 1rem 1rem 3.8rem; font-size:.93rem}
.ads div{display:flex; justify-content:space-between; gap:.6rem; border-bottom:1px dashed var(--rule); padding:.15rem 0}
.ads div.now{font-weight:600; color:var(--line)}
.note{color:var(--muted); font-size:.92rem; margin:.6rem 0 0; max-width:70ch}
.err{color:#b0413e}

/* cards */
.grid{display:grid; gap:1rem; grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--card); border:1px solid var(--rule); border-radius:18px; padding:1.1rem 1.2rem}
.card h3{font-family:var(--serif); font-weight:500; font-size:1.55rem; line-height:1.1; margin:0 0 .15rem; display:flex; align-items:baseline; gap:.5rem}
.card h3 .gl{color:var(--line)}
.card .sk{color:var(--muted); font-style:italic; margin:0 0 .6rem; font-family:var(--serif); font-size:1.08rem}
.card p{margin:0 0 .7rem; color:var(--muted); font-size:.97rem}
.card dl{display:grid; grid-template-columns:auto 1fr; gap:.15rem .8rem; margin:0; font-size:.92rem}
.card dt{color:var(--line); font-weight:500}
.card dd{margin:0}
.card.today{border-color:var(--line); box-shadow:0 0 0 1px var(--line) inset}
.tag{display:inline-block; font:500 .68rem var(--sans); letter-spacing:.12em; text-transform:uppercase; color:var(--btn-ink); background:var(--btn-bg); border-radius:999px; padding:.12rem .55rem; margin-left:.3rem}
.nakgrid{display:grid; gap:.6rem; grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.nak{background:var(--card); border:1px solid var(--rule); border-radius:14px; padding:.8rem 1rem}
.nak h3{font-family:var(--serif); font-weight:500; font-size:1.3rem; margin:0; display:flex; gap:.5rem; align-items:baseline}
.nak h3 small{font:500 .78rem var(--sans); color:var(--line)}
.nak .span{color:var(--muted); font-size:.85rem; margin:.1rem 0 .4rem; font-variant-numeric:tabular-nums}
.nak p{margin:0; font-size:.9rem}
.nak p b{color:var(--line); font-weight:500}
.nak.today{border-color:var(--line); box-shadow:0 0 0 1px var(--line) inset}

/* periods */
.periods{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:clamp(1.5rem,5vw,4rem); align-items:center}
.ring{width:100%; max-width:420px; justify-self:center}
.ptable{width:100%; border-collapse:collapse}
.ptable td{padding:.5rem .3rem; border-bottom:1px solid var(--rule)}
.ptable td:first-child{color:var(--line); width:2rem; text-align:center; font-size:1.2rem}
.ptable td.y{text-align:right; font-family:var(--serif); font-size:1.3rem; white-space:nowrap}
.ptable tr.tot td{border:0; font-weight:600}

/* houses */
.houses{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:clamp(1.5rem,5vw,4rem); align-items:start}
.hlist{display:grid; gap:.5rem; grid-template-columns:1fr 1fr}
.hlist div{border-bottom:1px solid var(--rule); padding:.3rem 0 .45rem}
.hlist b{font-family:var(--serif); font-size:1.25rem; font-weight:500}
.hlist b span{color:var(--line); margin-right:.35rem}
.hlist p{margin:.05rem 0 0; color:var(--muted); font-size:.92rem}
.guide{list-style:none; padding:0; margin:1rem 0 0; display:grid; gap:.5rem}
.guide li{padding-left:1.4rem; position:relative; color:var(--muted)}
.guide li::before{content:"✦"; position:absolute; left:0; color:var(--line)}
.gchart{width:100%; max-width:460px; display:block; margin:0 auto}
.gchart .ln{fill:none; stroke:var(--line); stroke-width:1.3}
.gchart .lag{fill:rgba(220,185,122,.14)}
.gchart .hn{font:500 22px var(--serif); fill:var(--ink); text-anchor:middle}
.gchart .hs{font:400 9.5px var(--sans); fill:var(--muted); text-anchor:middle}

/* sade sati + vedic vs western */
.two{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:clamp(1.5rem,5vw,4rem); align-items:start}
.status{font-family:var(--serif); font-size:1.5rem; line-height:1.3; margin:.4rem 0 .8rem}
.wins{list-style:none; padding:0; margin:0; display:grid; gap:.4rem}
.wins li{border:1px solid var(--rule); border-radius:12px; padding:.5rem .8rem; display:flex; justify-content:space-between; gap:.6rem; flex-wrap:wrap; background:var(--card)}
.wins li.now{border-color:var(--line); box-shadow:0 0 0 1px var(--line) inset}
.wins small{color:var(--muted)}
.big{font-family:var(--serif); font-size:clamp(2.6rem,6vw,4rem); line-height:1; color:var(--line); margin:.2rem 0 .6rem}
.compare{display:grid; grid-template-columns:1fr 1fr; gap:.6rem; margin:1rem 0}
.compare div{border:1px solid var(--rule); border-radius:14px; padding:.8rem 1rem}
.compare b{display:block; font:500 .72rem var(--sans); letter-spacing:.14em; text-transform:uppercase; color:var(--line)}
.compare span{font-family:var(--serif); font-size:1.4rem}

.close{padding:clamp(3.5rem,9vw,7rem) 0; text-align:center}
.close h2{font-family:var(--serif); font-weight:500; font-size:clamp(2rem,5vw,3.4rem); margin:0 0 1rem; text-wrap:balance}
.close p{color:var(--muted); max-width:52ch; margin:0 auto 2rem}
.disclaimer{color:var(--muted); font-size:.85rem; max-width:70ch; margin:2rem auto 0}
footer{padding:1.5rem 0 2.5rem; text-align:center; color:var(--muted); font-size:.9rem; background:#170b29; --muted:#bfaedb}

.lang{position:fixed; top:calc(env(safe-area-inset-top,0px) + 10px); right:max(12px,env(safe-area-inset-right,0px)); z-index:60; display:flex; gap:2px; padding:3px; border-radius:999px; background:rgba(23,11,41,.85); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); box-shadow:0 2px 12px rgba(0,0,0,.28)}
.lang button{font:inherit; font-size:.8rem; letter-spacing:.05em; color:#f4e8c8; background:transparent; border:0; border-radius:999px; padding:.32rem .85rem; cursor:pointer}
.lang button[aria-pressed="true"]{background:#dcb97a; color:#170b29; font-weight:500}

@media (max-width:820px){
  .hero .wrap,.periods,.houses,.two{grid-template-columns:1fr}
  .wheel{order:-1; max-width:360px}
  .hlist{grid-template-columns:1fr}
  .ads{padding-left:1rem}
}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} .btn{transition:none} .wheel .spin{animation:none} }
</style>
</head>
<body>

<div class="lang" role="group" aria-label="Language">
  <button type="button" data-lang="en" aria-pressed="true">ENG</button>
  <button type="button" data-lang="ru" aria-pressed="false">RUS</button>
</div>

<header class="hero dark">
  <div class="wrap">
    <div>
      <h1 data-t="h1"></h1>
      <p class="lead" data-t="lead"></p>
      <a class="btn" href="#transits" data-t="heroBtn"></a>
      <ul class="index">
        <li><a href="#transits" data-t="nTransits"></a></li>
        <li><a href="#dasha" data-t="nDasha"></a></li>
        <li><a href="#planets" data-t="nPlanets"></a></li>
        <li><a href="#signs" data-t="nSigns"></a></li>
        <li><a href="#nakshatras" data-t="nNak"></a></li>
        <li><a href="#periods" data-t="nPeriods"></a></li>
        <li><a href="#houses" data-t="nHouses"></a></li>
        <li><a href="#sadesati" data-t="nSade"></a></li>
        <li><a href="#zodiacs" data-t="nVW"></a></li>
      </ul>
    </div>
    <figure style="margin:0; position:relative">
      <svg class="wheel" id="wheel" viewBox="0 0 400 400" role="img"></svg>
      <figcaption class="wheel-cap" data-t="wheelCap"></figcaption>
    </figure>
  </div>
</header>

<main>
  <section class="sec dark" id="transits">
    <div class="wrap">
      <p class="label" data-t="liveLabel"></p>
      <h2 data-t="nTransits"></h2>
      <p class="intro" data-t="trIntro"></p>
      <div class="controls">
        <label><span data-t="date"></span><input type="date" id="trDate"></label>
        <label><span data-t="time"></span><input type="time" id="trTime" value="12:00"></label>
        <label><span data-t="tz"></span><select id="trTz"></select></label>
        <label><span data-t="yourLagna"></span><select id="trLagna"></select></label>
        <div class="toggle" role="group" aria-label="View">
          <button type="button" data-view="table" aria-pressed="true" data-t="table"></button>
          <button type="button" data-view="chart" aria-pressed="false" data-t="chart"></button>
        </div>
      </div>
      <div class="board" id="board" aria-live="polite"></div>
    </div>
  </section>

  <section class="sec white" id="dasha">
    <div class="wrap">
      <p class="label" data-t="calcLabel"></p>
      <h2 data-t="dTitle"></h2>
      <p class="intro" data-t="dIntro"></p>
      <form class="dform" id="dForm" novalidate>
        <div class="controls" style="margin:0">
          <label><span data-t="bDate"></span><input type="date" id="bDate" required min="1900-01-01" max="2100-12-31"></label>
          <label><span data-t="bTime"></span><input type="time" id="bTime" required></label>
          <label><span data-t="bTz"></span><select id="bTz"></select></label>
          <button class="btn" type="submit" data-t="calc"></button>
        </div>
        <p class="note" data-t="dNote"></p>
      </form>
      <div class="dres" id="dRes" aria-live="polite"></div>
    </div>
  </section>

  <section class="sec dark" id="planets">
    <div class="wrap">
      <h2 data-t="pTitle"></h2>
      <p class="intro" data-t="pIntro"></p>
      <div class="grid" id="pGrid"></div>
    </div>
  </section>

  <section class="sec" id="signs">
    <div class="wrap">
      <h2 data-t="sTitle"></h2>
      <p class="intro" data-t="sIntro"></p>
      <div class="grid" id="sGrid"></div>
    </div>
  </section>

  <section class="sec white" id="nakshatras">
    <div class="wrap">
      <h2 data-t="nkTitle"></h2>
      <p class="intro" data-t="nkIntro"></p>
      <div class="nakgrid" id="nkGrid"></div>
    </div>
  </section>

  <section class="sec dark" id="periods">
    <div class="wrap periods">
      <div>
        <h2 data-t="perTitle"></h2>
        <p class="intro" data-t="perIntro"></p>
        <table class="ptable" id="pTable"></table>
      </div>
      <svg class="ring" id="ring" viewBox="0 0 400 400" role="img"></svg>
    </div>
  </section>

  <section class="sec" id="houses">
    <div class="wrap">
      <h2 data-t="hTitle"></h2>
      <p class="intro" data-t="hIntro"></p>
      <div class="houses">
        <div class="hlist" id="hList"></div>
        <div>
          <svg class="gchart" id="gChart" viewBox="0 0 400 400" role="img"></svg>
          <h3 style="font-family:var(--serif);font-weight:500;font-size:1.6rem;margin:1.2rem 0 0" data-t="gTitle"></h3>
          <ul class="guide" id="gList"></ul>
        </div>
      </div>
    </div>
  </section>

  <section class="sec white" id="sadesati">
    <div class="wrap two">
      <div>
        <h2 data-t="ssTitle"></h2>
        <p class="intro" data-t="ssIntro"></p>
        <div class="controls"><label><span data-t="moonSign"></span><select id="ssMoon"></select></label></div>
        <p class="note" data-t="ssHint"></p>
      </div>
      <div id="ssRes" aria-live="polite"></div>
    </div>
  </section>

  <section class="sec dark" id="zodiacs">
    <div class="wrap two">
      <div>
        <h2 data-t="vwTitle"></h2>
        <p class="intro" data-t="vwIntro"></p>
        <p class="label" data-t="ayLabel"></p>
        <p class="big" id="ayNow">—</p>
        <div class="compare" id="vwCompare"></div>
      </div>
      <div id="vwPoints"></div>
    </div>
  </section>
</main>
